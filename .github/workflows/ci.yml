name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Test & Publish Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build stint
        run: cargo build

      - name: Run Rust unit and integration tests
        run: cargo test

      - name: Validate example and workspace task graphs
        run: |
          if [ -d .stint ]; then ./target/debug/stint check --strict; fi
          (cd examples/demo && ../../target/debug/stint check --strict)
          (cd examples/api-service && ../../target/debug/stint check --strict)

      - name: Run pi-stint extension tests
        env:
          STINT_BIN: ${{ github.workspace }}/target/debug/stint
        run: node --test packages/pi-stint/test/*.test.js

      - name: Check crate publishability
        run: just publish-check
