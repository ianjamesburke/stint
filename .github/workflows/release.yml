name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} --package stint

      - name: Package
        run: |
          ASSET="stint-${{ github.ref_name }}-${{ matrix.target }}"
          cp "target/${{ matrix.target }}/release/stint" "$ASSET"
          gzip "$ASSET"
          echo "ASSET=${ASSET}.gz" >> "$GITHUB_ENV"

      - name: Upload
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ env.ASSET }}

  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - name: Read crate version
        id: crate
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "stint") | .version')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Check crates.io
        id: published
        run: |
          if curl -fsSL https://crates.io/api/v1/crates/stint/versions | jq -e '.versions[] | select(.num == "${{ steps.crate.outputs.version }}")' >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        if: steps.published.outputs.exists == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish
