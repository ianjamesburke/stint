name: Release

on:
  push:
    branches:
      - main

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - name: Read crate version
        id: crate
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "stint") | .version')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Check crates.io
        id: published
        run: |
          if curl -fsSL https://crates.io/api/v1/crates/stint/versions | jq -e '.versions[] | select(.num == "${{ steps.crate.outputs.version }}")' >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        if: steps.published.outputs.exists == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish
