[workspace]
members = [
    "crates/stint-core",
    "crates/stint-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.2"
edition = "2021"
authors = ["Ian Burke <ianjamesburke@gmail.com>"]
license = "MIT"
repository = "https://github.com/ianjamesburke/stint"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "1"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
