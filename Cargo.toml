[package]
name = "stint"
version = "0.2.10"
edition = "2021"
authors = ["Ian Burke <ianjamesburke@gmail.com>"]
license = "MIT"
repository = "https://github.com/ianjamesburke/stint"
description = "Task and sprint tracking as markdown files in your repo"
readme = "README.md"
keywords = ["cli", "sprint", "tasks", "planning", "markdown"]
categories = ["command-line-utilities", "development-tools"]
exclude = [".stint", ".wtp.yml", ".github", "CLAUDE.md", "install.sh", "apps", "worktrees", ".plexi-beta"]

[lib]
name = "stint"
path = "src/lib.rs"

[[bin]]
name = "stint"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "1"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
owo-colors = "4"
crossterm = "0.28"
notify = "8"
ratatui = "0.29"
toml = "0.8"

[dev-dependencies]
tempfile = "3"
